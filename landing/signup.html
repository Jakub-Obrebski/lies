<!doctype html>
<html lang="pdl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title data-i18n="page.signup.title">Zalogovatisie | LIÊS</title>

        <link rel="stylesheet" href="styles/main.css">
    </head>
    <body class="page-login">
        <header>
            <div id="header-l">
                <a href="index.html" data-i18n="hero.app_name"></a>
            </div>
            <nav>
                <nav id="nav-l">
                    <!-- download page      --> <a href="downloads.html" data-i18n="header.link.download">Stiahnuti Liês</a>
                    <!-- features page      --> <a href="features.html" data-i18n="header.link.features">Funkcije</a>
                    <!-- privacy            --> <a href="privacy.html" data-i18n="header.link.privacy">Pryvatnosť</a>
                    <!-- blog               --> <a href="blog.html" data-i18n="header.link.blog">Blog</a>
                    <!-- documentation page --> <a href="docs.html" data-i18n="header.link.docs">Dokumentacija</a>
                    <!-- contact support    --> <a href="contact.html" data-i18n="header.link.support">Pomošč</a>
                    <!-- about lies         --> <a href="about.html" data-i18n="header.link.about">Pro programu</a>
                </nav>
                <div id="nav-r">
                    <a href="login.html" data-i18n="generic.login_page"></a>
                    <button id="language-switcher" type="button" aria-label="Language switcher" aria-expanded="false">
                        <span class="material-icons" aria-hidden="true">language</span>
                    </button>
                    <button id="theme-switcher" type="button" aria-label="Theme switcher" aria-expanded="false">
                        <span class="material-icons" aria-hidden="true">dark_mode</span>
                    </button>
                </div>
            </nav>
        </header>
        <main id="login-main">
            <div id="login-card">
                <div class="login-field">
                    <label for="username" data-i18n="login.field.username">Nazva korystálnika</label>
                    <input type="text" id="username" name="username" autocomplete="username">
                </div>
                <div class="login-field">
                    <label for="email" data-i18n="login.field.email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                </div>
                <div class="login-field">
                    <label for="password" data-i18n="login.field.password">Paról</label>
                    <input type="password" id="password" name="password" autocomplete="current-password">
                </div>
                <a id="forgot-password" href="#" data-i18n="login.forgot_password"></a>
                <button id="login-submit" type="button" data-i18n="generic.submit"></button>
                <p id="login-footer">
                    <span data-i18n="login.yes_account"></span>
                    <a href="login.html" data-i18n="login.login"></a>
                </p>
            </div>
        </main>
        <script type="module" src="scripts/main.js"></script>
    </body>
</html>
