<!doctype html>
<html lang="pdl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title data-i18n="page.login.title">Zalogovatisie | LIÊS</title>

        <link rel="stylesheet" href="styles/main.css">
    </head>
    <body class="page-login">
        <header>
            <div id="header-l">
                <a href="index.html" data-i18n="hero.app_name"></a>
            </div>
            <nav>
                <div id="nav-l">
                    <a href="downloads.html" data-i18n="header.link.download"></a>
                    <a href="#" data-i18n="header.link.features"></a>
                    <a href="#" data-i18n="header.link.privacy"></a>
                    <a href="#" data-i18n="header.link.blog"></a>
                    <a href="#" data-i18n="header.link.docs"></a>
                    <a href="#" data-i18n="header.link.support"></a>
                    <a href="#" data-i18n="header.link.about"></a>
                </div>
                <div id="nav-r">
                    <a href="login.html" data-i18n="generic.login_page"></a>
                    <button id="language-switcher" type="button" aria-label="Language switcher" aria-expanded="false">
                        <span class="material-icons" aria-hidden="true">language</span>
                    </button>
                    <button id="theme-switcher" type="button" aria-label="Theme switcher" aria-expanded="false">
                        <span class="material-icons" aria-hidden="true">dark_mode</span>
                    </button>
                </div>
            </nav>
        </header>
        <main id="login-main">
            <div id="login-card">
                <div class="login-field">
                    <label for="email" data-i18n="login.field.email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                </div>
                <div class="login-field">
                    <label for="password" data-i18n="login.field.password">Paról</label>
                    <input type="password" id="password" name="password" autocomplete="current-password">
                </div>
                <a id="forgot-password" href="#" data-i18n="login.forgot_password"></a>
                <button id="login-submit" type="button" data-i18n="login.button.submit"></button>
                <p id="login-footer">
                    <span data-i18n="login.no_account"></span>
                    <a href="signup.html" data-i18n="login.signup_link"></a>
                </p>
            </div>
        </main>
        <script type="module" src="scripts/main.js"></script>
    </body>
</html>
