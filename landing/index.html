<!doctype html>
<html lang="pdl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title data-i18n="page.index.title"></title>

        <link rel="stylesheet" href="styles/main.css">
    </head>
    <body>
        <header>
            <div id="header-l">
                <a href="index.html" data-i18n="hero.app_name"></a>
            </div>
            <nav id="nav-l">
                    <!-- download page      --> <a href="downloads.html" data-i18n="header.link.download"></a>
                    <!-- features page      --> <a href="#" data-i18n="header.link.features"></a>
                    <!-- privacy            --> <a href="#" data-i18n="header.link.privacy"></a>
                    <!-- blog               --> <a href="#" data-i18n="header.link.blog"></a>
                    <!-- documentation page --> <a href="#" data-i18n="header.link.docs"></a>
                    <!-- contact support    --> <a href="#" data-i18n="header.link.support"></a>
                    <!-- about lies         --> <a href="#" data-i18n="header.link.about"></a>
            </nav>
            <nav id="nav-r">

                    <button id="language-switcher" type="button" aria-label="Language switcher" aria-expanded="false">
                        <span class="material-icons" aria-hidden="true">language</span>
                    </button>
                    <button id="theme-switcher" type="button" aria-label="Theme switcher" aria-expanded="false">
